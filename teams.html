<script>/* Look: auto (follow the device) | home (light) | road (dark). Runs before the page draws. */
(function(){var look="auto",mq=matchMedia("(prefers-color-scheme: dark)");try{look=localStorage.getItem("stickpicks-look")||"auto"}catch(e){}
function apply(){var dark=look==="road"||(look==="auto"&&mq.matches);document.documentElement.setAttribute("data-scheme",dark?"dark":"light");
document.querySelectorAll('meta[name="theme-color"][data-look]').forEach(function(m){m.media=(m.dataset.look==="road")===dark?"all":"not all"})}
apply();if(mq.addEventListener)mq.addEventListener("change",apply);
window.stickpicksLook={get:function(){return look},set:function(v){look=v;try{localStorage.setItem("stickpicks-look",v)}catch(e){}apply()}}})();</script>

<script>
// All 32 teams by division, as tiles in team colours. Marks the sheet you opened last
// and any sheets with picks saved in this browser.
(function buildTeams(){
  let last=null; try{ last=localStorage.getItem("nhl-picks-last-team"); }catch(e){}
  const started=code=>{ try{ const v=JSON.parse(localStorage.getItem(`nhl-picks-${SEASON}-${code}`)||"{}"); return v && Object.keys(v).length>0; }catch(e){ return false; } };
  const root=document.getElementById("divisions");
  DIVISIONS.forEach(div=>{
    const sec=document.createElement("section"); sec.className="division";
    const h=document.createElement("h2"); h.textContent=`${div} Division`; sec.appendChild(h);
    const grid=document.createElement("div"); grid.className="tiles";
    Object.keys(TEAMS).filter(c=>TEAMS[c].div===div).sort((a,b)=>TEAMS[a].name.localeCompare(TEAMS[b].name)).forEach(c=>{
      const t=TEAMS[c], a=document.createElement("a");
      a.className="tile"; a.href=`sheet.html?team=${c}`;
      teamStyle(a,c);
      const code=document.createElement("span"); code.className="tile-code"; code.textContent=c;
      const name=document.createElement("span"); name.className="tile-name"; name.textContent=t.name;
      a.append(code,name);
      const tag = c===last ? "Last opened" : started(c) ? "Started" : "";
      if(tag){ const s=document.createElement("span"); s.className="tile-tag"; s.textContent=tag; a.appendChild(s); }
      grid.appendChild(a);
    });
    sec.appendChild(grid); root.appendChild(sec);
  });
})();
</script>
