<script>/* Look: auto (follow the device) | home (light) | road (dark). Runs before the page draws. */
(function(){var look="auto",mq=matchMedia("(prefers-color-scheme: dark)");try{look=localStorage.getItem("stickpicks-look")||"auto"}catch(e){}
function apply(){var dark=look==="road"||(look==="auto"&&mq.matches);document.documentElement.setAttribute("data-scheme",dark?"dark":"light");
document.querySelectorAll('meta[name="theme-color"][data-look]').forEach(function(m){m.media=(m.dataset.look==="road")===dark?"all":"not all"})}
apply();if(mq.addEventListener)mq.addEventListener("change",apply);
window.stickpicksLook={get:function(){return look},set:function(v){look=v;try{localStorage.setItem("stickpicks-look",v)}catch(e){}apply()}}})();
/* Playoff colours (silver, black and gold) when playoff mode is on: see playoffOn() in teams.js */
try{var po=JSON.parse(localStorage.getItem("stickpicks-playoffs")||"null");if(po&&(po.phase==="live"||po.phase==="done"||(po.phase==="countdown"&&po.choice==="playoffs")))document.documentElement.classList.add("playoffs")}catch(e){}</script>

<script>
mountTeamMenu(document.getElementById("teamMenu"));
// One entry per update, newest first (data and rules: pressbox.js and UPDATES.md)
(function(){
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const TAG={new:"New",improved:"Improved",fixed:"Fixed"};
  const day=d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  document.getElementById("pbList").innerHTML=PRESS_BOX.map((u,i)=>`
    <article class="pb-entry${u.name?" pb-named":""}" id="v${esc(u.version)}">
      <header class="pb-head">
        <span class="pb-ver" aria-label="Version ${esc(u.version)}">${esc(u.version)}</span>
        <div class="pb-title">
          ${u.name?`<h2 class="pb-name">${esc(u.name)}</h2>`:`<h2 class="pb-num">Update ${esc(u.version)}</h2>`}
          <time datetime="${esc(u.date)}">${day(u.date)}${i===0?' <b class="pb-latest">Latest</b>':""}</time>
        </div>
      </header>
      ${u.intro?`<p class="pb-intro">${esc(u.intro)}</p>`:""}
      <ul class="pb-items">${u.items.map(([t,x])=>`<li><span class="pb-tag ${t}">${TAG[t]}</span><span>${esc(x)}</span></li>`).join("")}</ul>
    </article>`).join("");
  try{ localStorage.setItem("stickpicks-pressbox-seen",PRESS_BOX[0].version); }catch(e){}
})();
</script>
