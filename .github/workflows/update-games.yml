name: Update NHL games

on:
  schedule:
    # Every 15 minutes, offset from :00 when GitHub's scheduler is busiest.
    # Scores usually land within about 15–30 minutes of the final horn.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual updates

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync schedules, final scores, and news headlines to Supabase
        run: node scripts/update-games.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
