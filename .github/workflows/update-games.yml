name: Update NHL games

on:
  schedule:
    # Every hour at :15 (UTC). Late West Coast games finish around 06:00 UTC,
    # so scores land within about an hour of the final horn.
    - cron: "15 * * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual updates

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync all 32 schedules and final scores to Supabase
        run: node scripts/update-games.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
