name: Update NHL games

on:
  schedule:
    # Every 15 minutes, offset from :00 when GitHub's scheduler is busiest.
    # Scores usually land within about 15–30 minutes of the final horn.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual updates

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync schedules, final scores, and news headlines to Supabase
        run: node scripts/update-games.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Puck-drop reminders (push notifications). A problem here never undoes the sync above.
      - name: Send puck-drop reminders
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7
          node scripts/send-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # The public half of the key pair (safe to publish; also in config.js)
          VAPID_PUBLIC_KEY: BG-EBGfRfCx8oybaL6jGuiJNpwlQK4hJcd6rX-hTUr2w9R5ebdP_EaOMOn8rwjzn65hyoIy7cCNnKT3PIT3J_wo
