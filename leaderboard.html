<script>/* Look: auto (follow the device) | home (light) | road (dark). Runs before the page draws. */
(function(){var look="auto",mq=matchMedia("(prefers-color-scheme: dark)");try{look=localStorage.getItem("stickpicks-look")||"auto"}catch(e){}
function apply(){var dark=look==="road"||(look==="auto"&&mq.matches);document.documentElement.setAttribute("data-scheme",dark?"dark":"light");
document.querySelectorAll('meta[name="theme-color"][data-look]').forEach(function(m){m.media=(m.dataset.look==="road")===dark?"all":"not all"})}
apply();if(mq.addEventListener)mq.addEventListener("change",apply);
window.stickpicksLook={get:function(){return look},set:function(v){look=v;try{localStorage.setItem("stickpicks-look",v)}catch(e){}apply()}}})();
/* Playoff colours (silver, black and gold) when playoff mode is on: see playoffOn() in teams.js */
try{var po=JSON.parse(localStorage.getItem("stickpicks-playoffs")||"null");if(po&&(po.phase==="live"||po.phase==="done"||(po.phase==="countdown"&&po.choice==="playoffs")))document.documentElement.classList.add("playoffs")}catch(e){}</script>

<script>
const sb = makeClient();
let team=null, myName=null;
mountTeamMenu(document.getElementById("teamMenu"));
mountChicletNav(sb);

const sel=document.getElementById("teamsel");
(function buildSelect(){
  const all=document.createElement("option"); all.value=""; all.textContent="All teams"; sel.appendChild(all);
  DIVISIONS.forEach(div=>{
    const og=document.createElement("optgroup"); og.label=`${div} Division`; sel.appendChild(og);
    Object.keys(TEAMS).filter(c=>TEAMS[c].div===div).sort((a,b)=>TEAMS[a].name.localeCompare(TEAMS[b].name))
      .forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=TEAMS[c].name; og.appendChild(o); });
  });
})();

/* ───────── Time frame: season, month or week ───────── */
// Weeks run Monday to Sunday and months are calendar months, by the date each game is played.
// Only games in that window count, so everyone starts each week and month level.
let period="season", pStart=null, seasonFirst=null;
const ymdOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function startOf(kind, d){
  const x=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if(kind==="month") x.setDate(1);
  if(kind==="week") x.setDate(x.getDate()-((x.getDay()+6)%7));   // back to Monday
  return x;
}
function endOf(kind, s){ const e=new Date(s); kind==="month" ? e.setMonth(e.getMonth()+1,0) : e.setDate(e.getDate()+6); return e; }
function stepped(dir){ const s=new Date(pStart); period==="month" ? s.setMonth(s.getMonth()+dir,1) : s.setDate(s.getDate()+7*dir); return s; }
const isCurrent=()=>period!=="season" && pStart.getTime()===startOf(period,new Date()).getTime();
const md=d=>d.toLocaleDateString([], {month:"short",day:"numeric"});
// Words for the time frame: kicker ("This week"), step label ("Oct 5 – 11") and a phrase for sharing ("this week")
function when(){
  if(period==="season") return {kicker:SEASON_LABEL, label:"", phrase:"this season"};
  const end=endOf(period,pStart), cur=isCurrent();
  if(period==="month"){
    const name=pStart.toLocaleDateString([], {month:"long",year:"numeric"});
    return {kicker: cur ? "This month" : name, label:name, phrase: cur ? "this month" : `in ${pStart.toLocaleDateString([], {month:"long"})}`};
  }
  const last=stepped(1).getTime()===startOf("week",new Date()).getTime();
  const label = pStart.getMonth()===end.getMonth() ? `${md(pStart)} – ${end.getDate()}` : `${md(pStart)} – ${md(end)}`;
  return {kicker: cur ? "This week" : last ? "Last week" : `Week of ${md(pStart)}`, label, phrase: cur ? "this week" : last ? "last week" : `the week of ${md(pStart)}`};
}
function setPeriod(kind, start, reload=true){
  period = ["month","week"].includes(kind) ? kind : "season";
  if(period==="season") pStart=null;
  else{
    const now=startOf(period,new Date());
    pStart = start ? startOf(period,start) : now;
    if(pStart>now) pStart=now;
    if(seasonFirst && pStart<startOf(period,seasonFirst)) pStart=startOf(period,seasonFirst);
  }
  document.querySelectorAll(".lb-period button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.period===period)));
  document.getElementById("lbStep").classList.toggle("hidden", period==="season");
  if(period!=="season"){
    document.getElementById("pLabel").textContent=when().label;
    document.getElementById("pNext").disabled = isCurrent();
    document.getElementById("pPrev").disabled = !!seasonFirst && pStart<=startOf(period,seasonFirst);
  }
  if(reload){ describe(); load(); }
}
document.querySelectorAll(".lb-period button").forEach(b=>b.addEventListener("click",()=>setPeriod(b.dataset.period)));
document.getElementById("pPrev").addEventListener("click",()=>setPeriod(period, stepped(-1)));
document.getElementById("pNext").addEventListener("click",()=>setPeriod(period, stepped(1)));

// Banner, page title, footer and address for the board and time frame showing
/* ───────── Playoff boards: ?board=playoffs (the playoff sheet) or ?board=bracket ───────── */
let board="regular";
const PO_THEME={"--board":"#10151F","--board-ink":"#F3F5F7","--title":"#D9A33A","--stripe":"#C9CED4","--brand":"#D9A33A","--accent":"#C9CED4"};
const headCells=[...document.querySelectorAll(".lb thead th")], regularHeads=headCells.map(th=>[th.textContent, th.dataset.short, th.title]);
const PO_HEADS={
  playoffs:[null,null,["","",""],null,["Winners","Win","Right winners out of graded picks"],null,["Games picked",undefined,""]],
  bracket:[null,null,["Champion","Champ","Their pick to win it all (shown once brackets lock)"],null,["Series","Ser","Series winners called right"],["Lengths","Len","Series lengths called right"],["Series picked",undefined,""]]};
function setBoard(b, reload=true){
  board = b==="playoffs" || b==="bracket" ? b : "regular";
  document.querySelectorAll("#boardTabs button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.board===board)));
  const po=board!=="regular";
  document.querySelector(".lb-when").classList.toggle("hidden",po);
  document.querySelector(".lb-bar .sh-switch").classList.toggle("hidden",po);
  headCells.forEach((th,i)=>{ const h=po ? (PO_HEADS[board][i]||regularHeads[i]) : regularHeads[i];
    th.textContent=h[0]; if(h[1]===undefined) delete th.dataset.short; else th.dataset.short=h[1]; th.title=h[2]||""; });
  document.getElementById("teamCol").classList.toggle("hidden", board==="playoffs");
  document.documentElement.classList.toggle("poboard", po);   // silver stripes (styles.css)
  if(!reload) return;
  if(po){
    applyTheme(NEUTRAL_THEME); document.documentElement.classList.add("neutral");
    Object.entries(PO_THEME).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
    describe(); load();
  }else setTeam(team);
}
document.querySelectorAll("#boardTabs button").forEach(b=>b.addEventListener("click",()=>setBoard(b.dataset.board)));

function describe(){
  // the scoreboard's light strip: the team's colour on a team board (a brighter one if it's too dark to glow), red on All-Teams
  { const t=team&&TEAMS[team]; document.getElementById("you")?.style.setProperty("--jb-light",
      t ? firstReadable("#0E1420",[t.stripe||t.accent,t.accent,t.brand,t.board,"#EFE6D2"],2.2) : "#E8463F"); }
  const url=new URL(location.href);
  if(board!=="regular"){
    ["team","period","from"].forEach(k=>url.searchParams.delete(k)); url.searchParams.set("board",board); history.replaceState(null,"",url);
    const name = board==="playoffs" ? "Playoff Sheet" : "Bracket";
    document.getElementById("lbKicker").textContent=`${SEASON_LABEL} playoffs · Leaderboard`;
    document.getElementById("headline").textContent=name;
    setPageMeta({title:`${name} leaderboard · stickpicks`, canonical:`leaderboard.html?board=${board}`,
      description: board==="playoffs" ? "The stickpicks playoff sheet leaderboard: every playoff game, 1 point for the winner and 1 for the exact goals. Free, no money."
        : "The stickpicks playoff bracket leaderboard: every series winner and length, 1, 2, 4 or 8 points by round. Free, no money."});
    document.getElementById("scope").textContent = board==="playoffs"
      ? "Every playoff sheet. 1 point for the right winner, 1 for the exact goals."
      : "Every bracket. Right winner: 1, 2, 4 or 8 points by round, +1 for the right number of games.";
    return;
  }
  url.searchParams.delete("board");
  team ? url.searchParams.set("team",team) : url.searchParams.delete("team");
  period==="season" ? url.searchParams.delete("period") : url.searchParams.set("period",period);
  period==="season" ? url.searchParams.delete("from") : url.searchParams.set("from",ymdOf(pStart));
  history.replaceState(null,"",url);
  const w=when();
  // Same format on every board: "<when> · <which> leaderboard" above the name in script
  document.getElementById("lbKicker").textContent = `${w.kicker} · ${team ? "team leaderboard" : "Leaderboard"}`;
  document.getElementById("headline").textContent = team ? TEAMS[team].name : "All-Teams";
  // search engines: one page per board (the season view; months and weeks aren't separate pages)
  setPageMeta({title:`${team?TEAMS[team].name+" ":""}Leaderboard${period==="season"?"":" · "+w.kicker} · stickpicks`,
    canonical: team ? `leaderboard.html?team=${team}` : "leaderboard.html",
    description: team ? `The ${TEAMS[team].name} pick'em leaderboard: ${teamNick(team)} fans ranked by how well they call every ${teamNick(team)} game. Free, no money, no ads.`
      : "The stickpicks All-Teams leaderboard: every pick sheet for every NHL team, ranked by season, month and week. Free, no money, no ads."});
  document.getElementById("scope").textContent = (team
    ? `Every ${TEAMS[team].name} pick sheet.`
    : "Every pick sheet, each ranked on its own.") + (period==="season" ? "" : ` Only games played ${w.phrase} count.`);
}

function setTeam(code){
  team = code && TEAMS[code] ? code : null;
  sel.value = team || "";
  applyTheme(team || (playoffOn() ? PLAYOFF_THEME : NEUTRAL_THEME));   // All teams in playoff mode: black, silver and gold
  document.documentElement.classList.toggle("neutral", !team); // All teams: plain wool page
  describe(); load();
}
sel.addEventListener("change",()=>setTeam(sel.value));

const rowsEl=document.getElementById("rows"), emptyEl=document.getElementById("empty"),
      wrapEl=document.getElementById("tablewrap"), youEl=document.getElementById("you");

function showEmpty(msg){ emptyEl.textContent=msg; emptyEl.classList.remove("hidden"); wrapEl.classList.add("hidden"); }

let loading=0;
async function load(){
  if(!sb){ showEmpty("Can’t reach stickpicks right now. Check your connection and try again."); document.getElementById("updated").textContent="Offline"; return; }
  if(board!=="regular") return loadPlayoffBoard();
  const ticket=++loading, want=team;
  const args={p_season:SEASON, p_team:team};
  if(period!=="season"){ args.p_from=ymdOf(pStart); args.p_to=ymdOf(endOf(period,pStart)); }
  const {data,error}=await sb.rpc("leaderboard",args);
  if(ticket!==loading || want!==team) return; // a newer request replaced this one
  if(error){ showEmpty(`Couldn’t load the leaderboard: ${error.message}`); return; }
  await loadFaces((data||[]).map(r=>r.username));
  if(ticket!==loading) return;
  document.getElementById("updated").textContent=`Updated ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",timeZoneName:"short"})}`;
  render(data||[]);
}

function swatch(code){
  const t=TEAMS[code], sw=document.createElement("span"); sw.className="sw"; sw.textContent=code;
  teamStyle(sw,code);
  return sw;
}
// Profile pictures for the names on the board, fetched once per page visit (lower-case username → picture).
const faces=new Map();
async function loadFaces(names){
  const need=[...new Set(names)].filter(n=>!faces.has(n.toLowerCase()));
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    const {data}=await sb.from("profiles").select("*").in("username",chunk);
    chunk.forEach(n=>faces.set(n.toLowerCase(),null));
    (data||[]).forEach(p=>faces.set(p.username.toLowerCase(),avatarFromProfile(p)));
  }
}
const frac=(hit,of)=>of?`${hit}<span class="muted frac">/${of}</span>`:"—";

function render(list){
  rowsEl.innerHTML="";
  if(!list.length){
    showEmpty(period!=="season"
      ? `No picks for games played ${when().phrase}${team?` on ${TEAMS[team].name} sheets`:""} yet.`
      : team ? `No one has made ${TEAMS[team].name} picks with a username yet.` : "No one is on the leaderboard yet. Sign in on the home page, choose a username, and make some picks.");
  }else{ emptyEl.classList.add("hidden"); wrapEl.classList.remove("hidden"); }

  let rank=0, prevPts=null; const mine=[];
  list.forEach((r,i)=>{
    const pts=Number(r.points);
    if(pts!==prevPts){ rank=i+1; prevPts=pts; }
    const tr=document.createElement("tr");
    const isMe = myName && r.username.toLowerCase()===myName.toLowerCase();
    if(isMe){ tr.className="me"; mine.push({rank, pts, team:r.team, res:[Number(r.outcome_points),Number(r.outcome_graded)], gls:[Number(r.goals_points),Number(r.goals_graded)]}); }
    tr.innerHTML=`
      <td class="rank"><span class="rk${rank<=3&&pts>0?" r"+rank:""}">${rank}</span></td>
      <td class="name"></td>
      <td class="teamcell"></td>
      <td class="pts">${pts}</td>
      <td>${frac(Number(r.outcome_points),Number(r.outcome_graded))}</td>
      <td>${frac(Number(r.goals_points),Number(r.goals_graded))}</td>
      <td class="opt">${r.total_picks}</td>`;
    // Player name → their profile. Team → their pick sheet for that team (the rest of the row too).
    const teamName=TEAMS[r.team]?.name||r.team;
    const sheetUrl = isMe ? `sheet.html?team=${r.team}` : `sheet.html?team=${r.team}&user=${encodeURIComponent(r.username)}`;
    const profileUrl = isMe ? "profile.html" : `profile.html?user=${encodeURIComponent(r.username)}`;
    const nameLink=document.createElement("a"); nameLink.href=profileUrl; nameLink.className="lb-who";
    const nm=document.createElement("span"); nm.textContent=r.username;
    nameLink.append(avatarEl(faces.get(r.username.toLowerCase()), r.username, 28), nm);
    nameLink.title = isMe ? "Your profile" : `See ${r.username}’s profile`;
    tr.querySelector(".name").appendChild(nameLink);
    tr.classList.add("clickable");
    tr.addEventListener("click",e=>{ if(!e.target.closest("a")) location.href=sheetUrl; });
    const a=document.createElement("a");
    a.href=sheetUrl; a.className="teamlink"; a.title = isMe ? `Your ${teamName} pick sheet` : `See ${r.username}’s ${teamName} pick sheet`;
    const tn=document.createElement("span"); tn.className="tname"; tn.textContent=teamName;
    a.append(swatch(r.team), tn);
    tr.querySelector(".teamcell").appendChild(a);
    rowsEl.appendChild(tr);
  });

  renderYou(list.length, mine);
}

// The playoff sheet board and the bracket board: one row per player
async function loadPlayoffBoard(){
  const ticket=++loading, want=board;
  const {data,error}=await sb.rpc(board==="playoffs" ? "playoff_leaderboard" : "bracket_leaderboard", {p_season:SEASON});
  if(ticket!==loading || want!==board) return;
  if(error){ showEmpty("Couldn’t load the leaderboard. Please try again in a moment."); return; }
  await loadFaces((data||[]).map(r=>r.username));
  if(ticket!==loading) return;
  document.getElementById("updated").textContent=`Updated ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",timeZoneName:"short"})}`;
  renderPlayoffBoard(data||[]);
}
function renderPlayoffBoard(list){
  rowsEl.innerHTML="";
  const bracket=board==="bracket";
  if(!list.length) showEmpty(bracket ? "No brackets yet." : "No playoff picks yet.");
  else{ emptyEl.classList.add("hidden"); wrapEl.classList.remove("hidden"); }
  let rank=0, prevPts=null, mine=null;
  list.forEach((r,i)=>{
    const pts=Number(r.points); if(pts!==prevPts){ rank=i+1; prevPts=pts; }
    const isMe = myName && r.username.toLowerCase()===myName.toLowerCase();
    if(isMe) mine={rank, pts, a:bracket ? Number(r.series_right) : Number(r.winner_points), b:bracket ? Number(r.lengths_right) : Number(r.goals_points)};
    const tr=document.createElement("tr"); if(isMe) tr.className="me";
    const wins = bracket ? Number(r.series_right) : Number(r.winner_points);
    tr.innerHTML=`<td class="rank"><span class="rk${rank<=3&&pts>0?" r"+rank:""}">${rank}</span></td><td class="name"></td><td class="teamcell${bracket?"":" hidden"}"></td>
      <td class="pts">${pts}</td><td>${wins}</td><td>${bracket ? Number(r.lengths_right) : Number(r.goals_points)}</td><td class="opt">${bracket ? r.picked : r.total_picks}</td>`;
    const page = bracket ? "bracket.html" : "playoffs.html", url = isMe ? page : `${page}?user=${encodeURIComponent(r.username)}`;
    const nameLink=document.createElement("a"); nameLink.href=isMe ? "profile.html" : `profile.html?user=${encodeURIComponent(r.username)}`; nameLink.className="lb-who";
    const nm=document.createElement("span"); nm.textContent=r.username;
    nameLink.append(avatarEl(faces.get(r.username.toLowerCase()), r.username, 28), nm);
    tr.querySelector(".name").append(nameLink);
    if(bracket && r.champion){ const t=r.champion, a=document.createElement("span"); a.className="teamlink"; const tn=document.createElement("span"); tn.className="tname"; tn.textContent=TEAMS[t]?.name||t; a.append(swatch(t),tn); tr.querySelector(".teamcell").append(a); }
    tr.classList.add("clickable"); tr.addEventListener("click",e=>{ if(!e.target.closest("a")) location.href=url; });
    rowsEl.appendChild(tr);
  });
  // your spot
  youEl.classList.remove("hidden"); youEl.innerHTML="";
  const el=(tag,cls,text)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; youEl.appendChild(e); return e; };
  const name = bracket ? "bracket" : "playoff sheet";
  if(!myName){ el("div","you-label","Join the board"); el("p",null,`Sign in and choose a username to get your ${name} on the board.`); const a=el("a","btn","Sign in"); a.href="index.html#signin"; return; }
  if(!mine){ el("div","you-label",`Your ${name}`); el("p",null, bracket ? "You don’t have a bracket on the board." : "You haven’t made any playoff picks yet."); const a=el("a","btn", bracket ? "Open the bracket" : "Pick playoff games"); a.href=bracket?"bracket.html":"playoffs.html"; return; }
  youEl.append(scoreHead(`Your ${name}`, null, "").el);
  youEl.append(scoreCells([[mine.rank, list.length, "Rank", "rank"], [mine.pts, null, mine.pts===1 ? "Point" : "Points"],
    [mine.a, null, bracket ? "Series right" : "Winners"], [mine.b, null, bracket ? "Lengths right" : "Goals"]]));
}

/* ───────── Your spot: an arena scoreboard ───────── */
// The top row: label, your team (on the All-Teams board), an optional note, and a spot for the two buttons
function scoreHead(label, teamCode, note){
  const el=document.createElement("div"); el.className="sb-head";
  const who=document.createElement("div"); who.className="sb-who";
  const l=document.createElement("div"); l.className="you-label"; l.textContent=label; who.append(l);
  if(teamCode){ const t=document.createElement("div"); t.className="you-team"; const nm=document.createElement("span"); nm.textContent=TEAMS[teamCode]?.name||teamCode; t.append(swatch(teamCode), nm); who.append(t); }
  if(note){ const n=document.createElement("div"); n.className="sb-note"; n.textContent=note; who.append(n); }
  const acts=document.createElement("div"); acts.className="you-acts";
  el.append(who, acts);
  return {el, acts};
}
// The lit cells: [value, out of (or null), label, extra class]
function scoreCells(cells){
  const row=document.createElement("div"); row.className="sb-cells";
  for(const [v, of, label, cls] of cells){
    const c=document.createElement("div"); c.className="sb-cell"+(cls?" "+cls:"");
    const b=document.createElement("b"); b.textContent = of===0 ? "—" : String(v);
    if(of) { const sm=document.createElement("small"); sm.textContent=`/${of}`; b.append(sm); }
    const sp=document.createElement("span"); sp.textContent=label;
    c.append(b, sp); row.append(c);
  }
  return row;
}

/* ───────── Your standing (sidebar card) ───────── */
// Built only from numbers and the TEAMS list, never from usernames.
function renderYou(total, mine){
  youEl.classList.remove("hidden"); youEl.innerHTML="";
  const el=(tag,cls,text)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; youEl.appendChild(e); return e; };
  const link=(href,text)=>{ const a=el("a","btn",text); a.href=href; return a; };
  if(!myName){
    el("div","you-label","Join the board");
    if(sb && signedIn){ el("p",null,"Choose a username on the home page to appear on the leaderboard."); link("index.html#account","Choose a username"); }
    else { el("p",null,"Sign in and choose a username to get your sheets on the leaderboard."); link("index.html#signin","Sign in"); }
    return;
  }
  // Share my spot and Invite friends: two felt patches (top right of the scoreboard)
  let actsEl=null; const acts=()=>actsEl ||= el("div","you-acts");
  const w=when(), invite=()=>acts().append(shareButton("Invite friends", inviteSpec(myName), "felt-patch red you-invite"));
  if(!mine.length){
    el("div","you-label","Your sheets");
    el("p",null, period!=="season"
      ? `You don’t have picks for games played ${w.phrase}${team?` on your ${TEAMS[team].name} sheet`:""}.`
      : team ? `You haven’t made any ${TEAMS[team].name} picks yet.` : "You haven’t made any picks yet.");
    link(team ? `sheet.html?team=${team}` : "teams.html", team ? "Open this sheet" : "Pick Team");
    invite();
    return;
  }
  const best=mine[0]; // the list is sorted, so the first match is the best
  const teamName=TEAMS[best.team]?.name||best.team;
  const head=scoreHead((team ? "Your spot" : "Your best sheet") + (period==="season" ? "" : ` · ${w.kicker.toLowerCase()}`), team ? null : best.team, mine.length>1 ? `${mine.length} sheets on the board, highlighted below` : "");
  youEl.append(head.el); actsEl=head.acts;
  youEl.append(scoreCells([[best.rank, total, "Rank", "rank"], [best.pts, null, best.pts===1 ? "Point" : "Points"],
    [best.res[0], best.res[1], "Results"], [best.gls[0], best.gls[1], "Goals"]]));
  // Share your spot: links straight to this board and time frame
  const board = team ? `${teamName} leaderboard` : "All-Teams leaderboard";
  acts().append(shareButton("Share my spot", {kind:"standing", title:`stickpicks ${board}`, url:SITE_URL+"leaderboard.html"+location.search,
    text:`I’m #${best.rank} of ${total} on the stickpicks ${board} ${w.phrase}, with ${best.pts} point${best.pts===1?"":"s"} on my ${teamName} sheet. Think you can pick better?`,
    card:{kicker:`${w.kicker} · ${team ? teamName : "All-Teams"} board`, title:`#${best.rank} of ${total}`,
      sub:`${myName} · ${best.pts} point${best.pts===1?"":"s"} on the ${teamName} sheet.`}}, "felt-patch you-share"));
  invite();
}

let signedIn=false;
async function start(){
  if(sb){
    const {data:{session}}=await sb.auth.getSession();
    signedIn=!!session;
    if(session){
      const {data}=await sb.from("profiles").select("*").eq("user_id",session.user.id).maybeSingle();
      myName=data?.username||null;
      if(myName) rememberMe(myName, avatarFromProfile(data));
    }
    setInterval(load, 60*1000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
    // the season's first game day: the earliest week and month you can step back to
    const {data:first}=await sb.from("games").select("game_date").eq("season",SEASON).eq("game_type",2).order("game_date").limit(1);
    if(first?.[0]) seasonFirst=new Date(first[0].game_date+"T12:00:00");
  }
  const q=new URL(location.href).searchParams, from=/^\d{4}-\d{2}-\d{2}$/.test(q.get("from")||"") ? new Date(q.get("from")+"T12:00:00") : null;
  setPeriod(q.get("period"), from, false);
  // Playoff boards: shown once the playoffs exist; in playoff mode the board opens on the playoff sheet
  const asked=q.get("board"), c=poCache();
  const showTabs=st=>document.getElementById("boardTabs").classList.toggle("hidden", !(asked || (st.phase && st.phase!=="none")));
  showTabs(c);
  const first = asked || (playoffOn(c) && !q.get("team") && !q.get("period") ? "playoffs" : "regular");
  setBoard(first, false);
  team = q.get("team")?.toUpperCase() && TEAMS[q.get("team").toUpperCase()] ? q.get("team").toUpperCase() : null;
  if(board!=="regular") setBoard(board); else setTeam(team);
  refreshPlayoffMode(sb).then(showTabs);
}
start();
</script>
